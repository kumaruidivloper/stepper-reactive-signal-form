<div class="container">
  <h2>Add New Contact</h2>

  <!-- formGroup goes on the <form> element -->
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div class="form">
      <mat-form-field>
        <input matInput placeholder="Name" formControlName="name" />
        <mat-error *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
          Name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <input matInput placeholder="Email Address" formControlName="email" />
        <mat-error *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <input matInput placeholder="Phone" formControlName="phone" />
        <mat-error *ngIf="contactForm.get('phone')?.invalid && contactForm.get('phone')?.touched">
          Enter a valid 10-digit phone number
        </mat-error>
      </mat-form-field>
    </div>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="contactForm.invalid">
        Save
      </button>
      <button mat-raised-button routerLink="/">Back</button>
    </div>
  </form>
</div>
